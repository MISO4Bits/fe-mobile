name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Gradle 8.13 no soporta JDK 25. El toolchain del proyecto es 17 y la JVM
  # que corre Gradle es 21, que es la combinacion que si esta soportada.
  JAVA_VERSION: "21"

jobs:
  # Required check. Mismo binario directo que el resto de los repos: la
  # Action oficial de gitleaks exige licencia a partir del segundo repo.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Escanear historial
        run: ./gitleaks detect --source . --no-banner -v --config .gitleaks.toml

  # Required check. Estilo (detekt) y reglas de negocio (JUnit 5).
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: detekt
        run: ./gradlew detekt

      # koverVerifyDebug corre las pruebas y despues comprueba el umbral del
      # 80 % que declara la Estrategia de Pruebas. Si la cobertura baja, el
      # paso falla y el APK no se construye.
      - name: Pruebas unitarias y cobertura (umbral 80%)
        run: ./gradlew koverVerifyDebug

      - name: Generar el reporte de cobertura
        if: always()
        run: ./gradlew koverXmlReportDebug koverHtmlReportDebug

      - name: Subir los reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas
          path: |
            app/build/reports/tests/
            app/build/reports/kover/
          retention-days: 7

      - name: Subir el reporte de cobertura para SonarQube
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: app/build/reports/kover/reportDebug.xml
          retention-days: 1

  # Required check. Espera el quality gate de SonarQube Cloud, igual que el
  # resto de los repos.
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v8
        with:
          name: coverage-xml
          path: app/build/reports/kover

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # El APK de depuracion, para poder instalarlo desde la corrida. No corre en
  # pull_request: igual que las imagenes de los servicios, solo se genera al
  # hacer push a main/develop o al taguear una version.
  apk:
    name: apk
    runs-on: ubuntu-latest
    needs: [gitleaks, quality, sonar]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Construir el APK de depuracion
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
