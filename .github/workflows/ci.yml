name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # Gradle 8.13 no soporta JDK 25. El toolchain del proyecto es 17 y la JVM
  # que corre Gradle es 21, que es la combinacion que si esta soportada.
  JAVA_VERSION: "21"

jobs:
  # Required check. Mismo binario directo que el resto de los repos: la
  # Action oficial de gitleaks exige licencia a partir del segundo repo.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Escanear historial
        run: ./gitleaks detect --source . --no-banner -v --config .gitleaks.toml

  # Required check. Estilo (detekt) y reglas de negocio (JUnit 5).
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: detekt
        run: ./gradlew detekt

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Subir el reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: app/build/reports/tests/
          retention-days: 7

  # El APK de depuracion, para poder instalarlo desde la corrida.
  apk:
    name: apk
    runs-on: ubuntu-latest
    needs: [gitleaks, quality]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Construir el APK de depuracion
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
