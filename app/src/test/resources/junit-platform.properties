# Las pruebas unitarias corren en orden aleatorio, clases y metodos. Si una
# prueba depende de lo que dejo otra, falla en alguna corrida (BITS-280).
# JUnit escribe la semilla en el log para poder repetir una corrida.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
