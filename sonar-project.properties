# Configuración de SonarQube Cloud (DI-005). Ajusta sonar.organization
# y sonar.projectKey con los valores exactos que muestra "Configure
# analysis" dentro del proyecto en sonarcloud.io si difieren de estos.
sonar.organization=miso4bits
sonar.projectKey=MISO4Bits_fe-mobile

sonar.sources=app/src/main
sonar.tests=app/src/test,app/src/androidTest

# Reporte que genera Kover con la tarea koverXmlReportDebug.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/kover/reportDebug.xml

# Lo mismo que Kover deja fuera del umbral del 80 % (app/build.gradle.kts):
# el arranque, la interfaz de Compose y lo que depende del dispositivo (la
# boveda sobre el Keystore, las fotos, el dialogo de la huella y las
# preferencias) y, en los avisos push (BITS-229), el servicio de Firebase, la Application,
# el token y el permiso del sistema, que se verifican con pruebas instrumentadas en un emulador.
sonar.coverage.exclusions=**/MainActivity.kt,**/ui/tema/**,**/Pantalla*.kt,**/BarraSolventa.kt,**/FormularioAMano.kt,**/BovedaKeystore.kt,**/PreparadorDeFotos.kt,**/MensajesDeEvidencia.kt,**/AutenticadorBiometrico.kt,**/PreferenciasDelTelefono.kt,**/sesion/ui/Huella.kt,**/AplicacionSolventa.kt,**/avisos/ServicioDeAvisos.kt,**/avisos/datos/FuenteDeTokenFirebase.kt,**/avisos/datos/PermisoDelTelefono.kt,**/avisos/ui/AvisosDelSeguro.kt

# Hace que el paso del escáner espere el resultado del quality gate y
# falle si no pasa — sin esto, el job "sonar" solo sube el análisis y
# queda en verde aunque el gate falle (DI-006: sonar es required check).
sonar.qualitygate.wait=true
